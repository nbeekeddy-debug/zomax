version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
      tooling:
        patterns:
          - typescript
          - vitest
          - tailwindcss
          - "@tailwindcss/*"
          - "@types/*"
    labels:
      - dependencies
